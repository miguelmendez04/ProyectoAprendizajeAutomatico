# Configuración del ETL de deserción en educación superior (Colombia).
# Todos los IDs de datasets fueron verificados contra datos.gov.co el 2026-11-05 (ver reports/fase0.md).

# Unidad de análisis de la tabla final: ies | programa | municipio. Con `ies` el contexto territorial
# se une por el municipio sede de la IES (DIVIPOLA).
unidad_analisis: ies

# Ventana temporal común a todas las fuentes (objetivo y matrícula SNIES: 2015-2021).
anios: [2015, 2016, 2017, 2018, 2019, 2020, 2021]

# Códigos DIVIPOLA que cambiaron (viejo: nuevo), ej. "94663": "94663". Se completa con el histórico de DANE (Fase 0 d).
cambios_codigo: {}

rutas:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  reports: reports

datasets:
  # Saber 11: dataset unificado, todos los periodos en una sola tabla (columna `periodo`, ej. 20152).
  saber11: kgxf-xxbe
  snies_matricula_mpio: y9ga-zwzy      # matrícula ES por municipio y nivel, desde 2005
  snies_matricula_programa: 5wck-szir  # matrícula por IES x programa x municipio (2015-2021)
  snies_ies: n5yy-8nav                 # catálogo oficial de IES (nombre, sector, principal/seccional)
  divipola_municipios: gdxc-w37w       # catálogo oficial de municipios

# TerriData (DNP): zips TerriData_Dim<N>.txt.zip descargados a mano (dimensiones 2, 4, 7, 8, 14, 16 y 25; la 25 trae las
# proyecciones de población con base en el censo 2005 que se usan para 2015-2017). Es la fuente
# de población, NBI/IPM, cobertura educativa, desempeño fiscal/municipal y mercado laboral; reemplaza los archivos del DANE.
terridata:
  directorio: data/raw/terridata

# Export de SPADIES (Analíticas > Deserción Anual > tipo de cálculo IES > IES: Diferenciado): `;`, BOM UTF-8,
# columnas IES;TIPO;1998-1..2024-2 y dos filas por IES (DESERTORES, MATRICULADOS). El código SNIES va en `IES`.
# tasa_desercion_t = desertores_t / matriculados_(t-2 semestres); la anual = suma de desertores / suma de
# matriculados t-2 de los dos semestres (promedio ponderado por el denominador).
spadies:
  archivo: data/raw/spadies/spadies_diferenciado.csv
  nacional: data/raw/spadies/spadies_nacional.csv   # solo contexto y control de sumas
  periodicidad: anual                                 # anual | semestre

# Denominador mínimo de la tasa: se excluyen las IES-año cuya matrícula de SPADIES en t-2 es menor (en la tasa anual,
# el promedio de los dos semestres). Con denominadores chicos la tasa es muy inestable (hay tasas cercanas a 100 %).
min_matriculados_t2: 100

# Posible cierre: una IES que dejó de reportar a SPADIES antes del final del archivo tiene tasas anómalas en sus últimos
# semestres (los 2 previos al último reporte, y ese reporte). Con true esas filas se excluyen; la bandera `posible_cierre`
# queda siempre en el dataset.
excluir_posible_cierre: true

# Inconsistencia entre fuentes: ratio_spadies_snies = denominador de SPADIES (matrícula t-2) / matrícula SNIES t-2.
# Se marca `inconsistencia_fuentes` si el ratio es > umbral o < 1/umbral, o si SNIES no tiene dato dentro de su cobertura.
excluir_inconsistencias: true
umbral_ratio_inconsistencia: 3

# Régimen especial: lista explícita de escuelas militares y policiales (códigos SNIES 2106, 2901-2906, 3114, 3901, 3902,
# 9101-9105 y 9107; no se usan prefijos: 9108 Instituto Caro y Cuervo y 9109 ITEC no son militares). La bandera
# `regimen_especial` queda siempre en el dataset.
excluir_regimen_especial: true

# SENA (9110): la bandera `es_sena` queda siempre en el dataset; solo se excluye si esta opción es true. Se mantiene
# (false) porque su tasa no es atípica; su tamaño se maneja con log_matriculados_ies_t2.
excluir_sena: false

# Las IES-año con tasa mayor que este umbral (tras el mínimo) se listan en reports/tasas_altas.csv
umbral_tasa_alta: 0.5

# Años de rezago de las variables de matrícula SNIES (2 = mismo desfase que el denominador de la tasa).
# Saber 11 y TerriData se rezagan 1 año.
rezago_matricula: 2

# Máximo de nulos tolerado por columna en la validación (proporción 0-1).
max_nulos_pct: 0.5

# Partición para la fase de modelado (src/modelado/particion.py)
modelado:
  # Variables que no entran como explicativas (ver src/modelado/particion.py). La población absoluta queda fuera hasta
  # contar con las retroproyecciones del DANE con base 2018 (cambio de base 2005 -> 2018 entre 2017 y 2018).
  # El tamaño por defecto es log_matriculados_spadies_t2; log_matriculados_ies_t2 (SNIES) es la alternativa.
  excluir_variables: [td_poblacion_total_t1, ratio_spadies_snies, matriculados_ies_t2, log_matriculados_ies_t2]
  # Sensibilidad para el paper: true quita las filas del SENA al cargar el dataset (cargar_dataset), sin rehacer el pipeline.
  excluir_sena: false
  # Años del modelado: (2015, 2021) por defecto; [2017, 2021] es la sensibilidad sin los años donde faltan MDM y SNIES
  ventana_modelado: [2015, 2021]
  # Incluye falta_saber11, falta_mdm y falta_snies como variables 0/1 (marcan los bloques de años sin dato)
  incluir_indicadores_falta: true
  transformacion_objetivo: ninguna   # ninguna | logit  (src/modelado/objetivo.py)
  epsilon_logit: 0.001               # la tasa se recorta a [epsilon, 1 - epsilon] antes del logit
  # --- Opciones de mitigación de sesgo (todas apagadas por defecto; ver reports/analisis_sesgo.md) ---
  # Pesos por fila para sample_weight: ninguno | matriculados | raiz_matriculados | inverso_grupo | inverso_ies
  pesos_muestrales: ninguno
  grupos_pesos: [sector, caracter]   # grupos del esquema inverso_grupo
  # Denominador mínimo más alto que min_matriculados_t2 (p. ej. 200), aplicado al cargar. null = sin filtro adicional.
  # Un umbral menor que el del pipeline (p. ej. 50) exige regenerar el dataset con ese min_matriculados_t2.
  umbral_denominador: null
  # true agrega n_anios_ies y panel_incompleto al cargar y deja panel_incompleto entre las explicativas
  # (usa años posteriores al de cada fila: sirve para diagnóstico, no es recomendable como variable)
  indicador_panel_incompleto: false

particion:
  n_splits: 5                  # GroupKFold por cod_ies
  ultimo_anio_entrenamiento: 2019   # temporal: entrena 2015-2019, prueba 2020-2021
  agrupar_por: ies             # ies | departamento (por departamento no se repite ningún territorio entre entrenamiento y prueba)
  estratificar_por: []         # [] = GroupKFold simple; [sector, caracter] estratifica los pliegues (solo con agrupar_por: ies)

