# Configuración del ETL de deserción en educación superior (Colombia).
# Todos los IDs de datasets fueron verificados contra datos.gov.co el 2026-11-05 (ver reports/fase0.md).

# Unidad de análisis de la tabla final: ies | programa | municipio. Con `ies` el contexto territorial
# se une por el municipio sede de la IES (DIVIPOLA).
unidad_analisis: ies

# Ventana temporal común a todas las fuentes (objetivo y matrícula SNIES: 2015-2021).
anios: [2015, 2016, 2017, 2018, 2019, 2020, 2021]

# Códigos DIVIPOLA que cambiaron (viejo: nuevo), ej. "94663": "94663". Se completa con el histórico de DANE (Fase 0 d).
cambios_codigo: {}

rutas:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  reports: reports

datasets:
  # Saber 11: dataset unificado, todos los periodos en una sola tabla (columna `periodo`, ej. 20152).
  saber11: kgxf-xxbe
  snies_matricula_mpio: y9ga-zwzy      # matrícula ES por municipio y nivel, desde 2005
  snies_matricula_programa: 5wck-szir  # matrícula por IES x programa x municipio (2015-2021)
  snies_ies: n5yy-8nav                 # catálogo oficial de IES (nombre, sector, principal/seccional)
  divipola_municipios: gdxc-w37w       # catálogo oficial de municipios

# TerriData (DNP): zips TerriData_Dim<N>.txt.zip descargados a mano (dimensiones 2, 4, 7, 8, 14, 16 y 25; la 25 trae las
# proyecciones de población con base en el censo 2005 que se usan para 2015-2017). Es la fuente
# de población, NBI/IPM, cobertura educativa, desempeño fiscal/municipal y mercado laboral; reemplaza los archivos del DANE.
terridata:
  directorio: data/raw/terridata

# Export de SPADIES (Analíticas > Deserción Anual > tipo de cálculo IES > IES: Diferenciado): `;`, BOM UTF-8,
# columnas IES;TIPO;1998-1..2024-2 y dos filas por IES (DESERTORES, MATRICULADOS). El código SNIES va en `IES`.
# tasa_desercion_t = desertores_t / matriculados_(t-2 semestres); la anual = suma de desertores / suma de
# matriculados t-2 de los dos semestres (promedio ponderado por el denominador).
spadies:
  archivo: data/raw/spadies/spadies_diferenciado.csv
  nacional: data/raw/spadies/spadies_nacional.csv   # solo contexto y control de sumas
  periodicidad: anual                                 # anual | semestre

# Denominador mínimo de la tasa: se excluyen las IES-año cuya matrícula de SPADIES en t-2 es menor (en la tasa anual,
# el promedio de los dos semestres). Con denominadores chicos la tasa es muy inestable (hay tasas cercanas a 100 %).
min_matriculados_t2: 100

# Posible cierre: una IES que dejó de reportar a SPADIES antes del final del archivo tiene tasas anómalas en sus últimos
# semestres (los 2 previos al último reporte, y ese reporte). Con true esas filas se excluyen; la bandera `posible_cierre`
# queda siempre en el dataset.
excluir_posible_cierre: true

# Inconsistencia entre fuentes: ratio_spadies_snies = denominador de SPADIES (matrícula t-2) / matrícula SNIES t-2.
# Se marca `inconsistencia_fuentes` si el ratio es > umbral o < 1/umbral, o si SNIES no tiene dato dentro de su cobertura.
excluir_inconsistencias: true
umbral_ratio_inconsistencia: 3

# Régimen especial: lista explícita de escuelas militares y policiales (códigos SNIES 2106, 2901-2906, 3114, 3901, 3902,
# 9101-9105 y 9107; no se usan prefijos: 9108 Instituto Caro y Cuervo y 9109 ITEC no son militares). La bandera
# `regimen_especial` queda siempre en el dataset.
excluir_regimen_especial: true

# SENA (9110): la bandera `es_sena` queda siempre en el dataset; solo se excluye si esta opción es true. Se mantiene
# (false) porque su tasa no es atípica; su tamaño se maneja con log_matriculados_ies_t2.
excluir_sena: false

# Las IES-año con tasa mayor que este umbral (tras el mínimo) se listan en reports/tasas_altas.csv
umbral_tasa_alta: 0.5

# Años de rezago de las variables de matrícula SNIES (2 = mismo desfase que el denominador de la tasa).
# Saber 11 y TerriData se rezagan 1 año.
rezago_matricula: 2

# Máximo de nulos tolerado por columna en la validación (proporción 0-1).
max_nulos_pct: 0.5

# Agrega al dataset la historia de la tasa de cada IES con años anteriores (tasa_t1, tasa_t2, tasa_media_previa, n_anios_previos,
# falta_historia; src/integrate/historia.py). No son explicativas por defecto en el modelado.
incluir_historia: true
# La historia usa, para los años anteriores a `anios`, las tasas anuales de SPADIES (misma definición y filtros); no agrega filas.
historia_previa_a_ventana: true

# Partición para la fase de modelado (src/modelado/particion.py)
modelado:
  # Variables que no entran como explicativas (ver src/modelado/particion.py). La población absoluta queda fuera hasta
  # contar con las retroproyecciones del DANE con base 2018 (cambio de base 2005 -> 2018 entre 2017 y 2018).
  # El tamaño por defecto es log_matriculados_spadies_t2; log_matriculados_ies_t2 (SNIES) es la alternativa.
  excluir_variables: [td_poblacion_total_t1, ratio_spadies_snies, matriculados_ies_t2, log_matriculados_ies_t2]
  # Sensibilidad para el paper: true quita las filas del SENA al cargar el dataset (cargar_dataset), sin rehacer el pipeline.
  excluir_sena: false
  # Años del modelado: (2015, 2021) por defecto; [2017, 2021] es la sensibilidad sin los años donde faltan MDM y SNIES
  ventana_modelado: [2015, 2021]
  # Incluye falta_saber11, falta_mdm y falta_snies como variables 0/1 (marcan los bloques de años sin dato)
  incluir_indicadores_falta: true
  transformacion_objetivo: ninguna   # ninguna | logit  (src/modelado/objetivo.py)
  epsilon_logit: 0.001               # la tasa se recorta a [epsilon, 1 - epsilon] antes del logit
  # --- Opciones de mitigación de sesgo (todas apagadas por defecto; ver reports/analisis_sesgo.md) ---
  # Pesos por fila para sample_weight: ninguno | matriculados | raiz_matriculados | inverso_grupo | inverso_ies
  pesos_muestrales: ninguno
  grupos_pesos: [sector, caracter]   # grupos del esquema inverso_grupo
  # Denominador mínimo más alto que min_matriculados_t2 (p. ej. 200), aplicado al cargar. null = sin filtro adicional.
  # Un umbral menor que el del pipeline (p. ej. 50) exige regenerar el dataset con ese min_matriculados_t2.
  umbral_denominador: null
  # true agrega n_anios_ies y panel_incompleto al cargar y deja panel_incompleto entre las explicativas
  # (usa años posteriores al de cada fila: sirve para diagnóstico, no es recomendable como variable)
  indicador_panel_incompleto: false
  # --- Motor de experimentos (src/modelado/experimentos.py; python run_experimentos.py) ---
  # La grilla es el producto cartesiano de las cuatro listas (2 x 2 x 3 x 3 = 36 configuraciones), con hiperparámetros por
  # defecto: el ajuste de hiperparámetros viene después. Todos los pliegues y las semillas son los mismos para todas.
  experimentos:
    semilla: 42
    n_jobs: 1                          # 1 para que los tiempos de ajuste sean comparables entre modelos
    objetivo: [ninguna, logit]         # logit: TransformedTargetRegressor con la inversa de objetivo.py
    imputacion: [mediana, knn]
    seleccion: [ninguna, info_mutua, pca]
    modelo: [ridge, random_forest, xgboost]
    k_vecinos: 5                       # KNNImputer
    k_info_mutua: 15                   # SelectKBest(mutual_info_regression)
    varianza_pca: 0.90                 # PCA conserva esta fracción de varianza
    ridge_alphas: {exp_min: -3, exp_max: 3, n: 13}   # RidgeCV: np.logspace(exp_min, exp_max, n)
    random_forest: {n_estimators: 300}
    xgboost: {n_estimators: 300, learning_rate: 0.05, max_depth: 4}
    salidas:
      resultados: reports/resultados/experimentos_v1.csv
      resumen: reports/resultados/experimentos_v1_resumen.csv
      informe: reports/resultados_v1.md
      figura: reports/figuras/mae_configuraciones.png
  # --- Formulaciones con historia de la IES (src/modelado/formulaciones.py; python run_formulaciones.py) ---
  # A contexto | B historia + contexto | B solo historia | C corrección sobre la ingenua (+ C solo historia). Los hiperparámetros, la
  # semilla y los pliegues son los de `experimentos` y `particion`. En C el objetivo es el cambio respecto a la ingenua (sin logit).
  formulaciones:
    incluir: [A_contexto, B_historia_contexto, B_solo_historia, C_correccion, C_correccion_solo_historia]
    objetivo: [ninguna, logit]
    imputacion: [mediana]
    seleccion: [ninguna, info_mutua, pca]
    modelo: [ridge, random_forest, xgboost]
    recortar_predicciones: true        # las predicciones finales se recortan a [0, 1]
    salidas:
      resultados: reports/resultados/experimentos_v2.csv
      resumen: reports/resultados/experimentos_v2_resumen.csv
      informe: reports/resultados_v2.md
      figura: reports/figuras/mae_formulaciones.png

  # --- Protocolo de evaluación v3 (src/modelado/protocolo.py; python run_protocolo_v3.py) ---
  # GroupKFold por IES (con mezcla) repetido con semillas distintas; mismos pliegues para todas las configuraciones. El conjunto de
  # configuraciones se FIJÓ ANTES de correr y no se modifica mirando resultados (lo protege tests/test_protocolo.py).
  # Imputación mediana en todas; selección «ninguna» salvo donde se indica; objetivo en logit donde se indica (en C el objetivo es
  # el cambio respecto a la ingenua, sin logit). «Rezagada» = sin usar la tasa de t-1 (escenario conservador).
  protocolo_v3:
    n_splits: 5
    semillas: [101, 102, 103, 104, 105]   # 5 repeticiones x 5 pliegues = 25 ajustes por configuración
    nivel_confianza: 0.95
    configuraciones:
      - {nombre: "A contexto | ridge logit info_mutua", formulacion: A_contexto, modelo: ridge, objetivo: logit, seleccion: info_mutua}
      - {nombre: "B historia+contexto | xgboost logit", formulacion: B_historia_contexto, modelo: xgboost, objetivo: logit, seleccion: ninguna}
      - {nombre: "B historia+contexto | ridge logit", formulacion: B_historia_contexto, modelo: ridge, objetivo: logit, seleccion: ninguna}
      - {nombre: "B solo historia | ridge logit", formulacion: B_solo_historia, modelo: ridge, objetivo: logit, seleccion: ninguna}
      - {nombre: "C corrección con contexto | ridge", formulacion: C_correccion, modelo: ridge, objetivo: ninguna, seleccion: ninguna}
      - {nombre: "C corrección con contexto | random_forest", formulacion: C_correccion, modelo: random_forest, objetivo: ninguna, seleccion: ninguna}
      - {nombre: "C corrección solo historia | ridge", formulacion: C_correccion_solo_historia, modelo: ridge, objetivo: ninguna, seleccion: ninguna}
      - {nombre: "C corrección solo historia | random_forest", formulacion: C_correccion_solo_historia, modelo: random_forest, objetivo: ninguna, seleccion: ninguna}
      - {nombre: "B historia+contexto | xgboost logit [rezagada]", formulacion: B_historia_rezagada_contexto, modelo: xgboost, objetivo: logit, seleccion: ninguna}
      - {nombre: "B historia+contexto | ridge logit [rezagada]", formulacion: B_historia_rezagada_contexto, modelo: ridge, objetivo: logit, seleccion: ninguna}
      - {nombre: "B solo historia | ridge logit [rezagada]", formulacion: B_solo_historia_rezagada, modelo: ridge, objetivo: logit, seleccion: ninguna}
      - {nombre: "C corrección con contexto | ridge [rezagada]", formulacion: C_correccion_rezagada, modelo: ridge, objetivo: ninguna, seleccion: ninguna}
      - {nombre: "C corrección con contexto | random_forest [rezagada]", formulacion: C_correccion_rezagada, modelo: random_forest, objetivo: ninguna, seleccion: ninguna}
      - {nombre: "C corrección solo historia | ridge [rezagada]", formulacion: C_correccion_solo_historia_rezagada, modelo: ridge, objetivo: ninguna, seleccion: ninguna}
      - {nombre: "C corrección solo historia | random_forest [rezagada]", formulacion: C_correccion_solo_historia_rezagada, modelo: random_forest, objetivo: ninguna, seleccion: ninguna}
    salidas:
      resultados: reports/resultados/experimentos_v3.csv
      resumen: reports/resultados/experimentos_v3_resumen.csv
      informe: reports/resultados_v3.md
      figura: reports/figuras/mae_v3_ic.png

  # --- Tarea 2: estimación sin historia («arranque en frío»), formulación A de contexto (src/modelado/tarea2.py; python run_tarea2.py) ---
  # Etapa a) cribado: GroupKFold por IES (5 pliegues, UNA semilla) sobre la grilla completa. Etapa b) confirmación: protocolo v3
  # (GroupKFold repetido 5 x 5, IC 95 % y t corregida de Nadeau y Bengio) con semillas DISTINTAS a la del cribado, para las líneas
  # base, la mejor configuración de cada modelo y la mejor de cada método de reducción del cribado.
  tarea2:
    semilla_cribado: 11
    semillas_confirmacion: [201, 202, 203, 204, 205]
    n_splits: 5
    nivel_confianza: 0.95
    n_jobs: -1                         # paralelo sobre (configuración, pliegue); cada modelo usa 1 hilo
    grilla:
      objetivo: [ninguna, logit]
      imputacion: [mediana, knn]
      reduccion: [ninguna, info_mutua, pca, kernel_pca, autoencoder]
      clusters: [false, true]
      modelo: [ridge, random_forest, xgboost]
    kernel_pca: {gamma: null}          # RBF; null = 1 / n_variables. Mismo nº de componentes que PCA al varianza_pca de experimentos
    autoencoder: {oculta: 16, cuello: 8, activacion: tanh, max_iter: 500, validation_fraction: 0.15, n_iter_no_change: 15, alpha: 0.0001}
    clusters: {k_min: 3, k_max: 8, n_init: 10}   # k por silueta; agrega cluster (one-hot) y distancias a los centroides
    salidas:
      cribado: reports/resultados/experimentos_tarea2_cribado.csv
      confirmacion: reports/resultados/experimentos_tarea2_confirmacion.csv
      resumen_confirmacion: reports/resultados/experimentos_tarea2_confirmacion_resumen.csv
      clusters: reports/resultados/clusters_tarea2.csv
      informe: reports/resultados_tarea2.md
      figura_metodologias: reports/figuras/tarea2_metodologias.png
      figura_clusters: reports/figuras/clusters.png

  # --- Ajuste de hiperparámetros con validación anidada, particiones temporales y arranque en frío estricto
  # (src/modelado/ajuste.py, temporal.py, arranque_frio.py; python run_ajuste_temporal.py). Las configuraciones se FIJARON antes de correr.
  ajuste_temporal:
    # Validación anidada: externa GroupKFold por IES (5 pliegues x 5 semillas, distintas a las del cribado, la confirmación y la v3);
    # interna GroupKFold por IES de 3 pliegues SOLO con el entrenamiento externo, RandomizedSearchCV de 30 iteraciones con scoring MAE.
    semillas_externas: [301, 302, 303, 304, 305]
    n_splits_externo: 5
    n_splits_interno: 3
    n_iter: 30
    semilla_busqueda: 42               # semilla del muestreo aleatorio de hiperparámetros y de los pliegues internos
    nivel_confianza: 0.95
    n_jobs: -1                         # paralelo sobre (configuración, pliegue externo); cada búsqueda interna usa 1 hilo por tarea
    k_info_mutua: [5, 10, 15, 20, 25, 30]   # si el preprocesamiento incluye info_mutua, también se ajusta k
    # Tarea 1 (con historia): C solo historia (ridge, random_forest, xgboost) y B historia + contexto (xgboost, logit).
    # Tarea 2: la mejor configuración de cada modelo de la confirmación (reports/resultados/experimentos_tarea2_confirmacion_resumen.csv).
    configuraciones_tarea1:
      - {nombre: "T1 C solo historia | ridge", formulacion: C_correccion_solo_historia, modelo: ridge, objetivo: ninguna, seleccion: ninguna, imputacion: mediana}
      - {nombre: "T1 C solo historia | random_forest", formulacion: C_correccion_solo_historia, modelo: random_forest, objetivo: ninguna, seleccion: ninguna, imputacion: mediana}
      - {nombre: "T1 C solo historia | xgboost", formulacion: C_correccion_solo_historia, modelo: xgboost, objetivo: ninguna, seleccion: ninguna, imputacion: mediana}
      - {nombre: "T1 B historia+contexto | xgboost logit", formulacion: B_historia_contexto, modelo: xgboost, objetivo: logit, seleccion: ninguna, imputacion: mediana}
    confirmacion_tarea2: reports/resultados/experimentos_tarea2_confirmacion_resumen.csv
    # Particiones temporales (para cada una se re-ajusta con búsqueda interna solo sobre los años de entrenamiento)
    particiones_temporales:
      prepandemia: {entrena: [2015, 2017], prueba: [2018, 2019]}
      estres: {entrena: [2015, 2019], prueba: [2020, 2021]}
    bootstrap: {replicas: 1000, semilla: 2026}   # IC 95 % por bootstrap sobre IES
    # Arranque en frío estricto (Tarea 2): confirmación 5 x 5 con las mismas configuraciones, agrupando por municipio sede
    arranque_frio: {agrupar_por: cod_divipola_mpio}
    salidas:
      ajuste: reports/resultados/ajuste.csv
      ajuste_resumen: reports/resultados/ajuste_resumen.csv
      hiperparametros: reports/resultados/ajuste_hiperparametros.csv
      temporal: reports/resultados/temporal.csv
      temporal_predicciones: reports/resultados/temporal_predicciones.csv
      temporal_grupos: reports/resultados/temporal_grupos.csv
      arranque_frio: reports/resultados/arranque_frio_municipio.csv
      arranque_frio_resumen: reports/resultados/arranque_frio_municipio_resumen.csv
      arranque_frio_pliegues: reports/resultados/arranque_frio_pliegues.csv
      informe: reports/resultados_ajuste_temporal.md
      figura_ajuste: reports/figuras/ajuste_vs_defecto.png
      figura_temporal: reports/figuras/temporal_por_anio.png

particion:
  n_splits: 5                  # GroupKFold por cod_ies
  ultimo_anio_entrenamiento: 2019   # temporal: entrena 2015-2019, prueba 2020-2021
  agrupar_por: ies             # ies | departamento (por departamento no se repite ningún territorio entre entrenamiento y prueba)
  estratificar_por: []         # [] = GroupKFold simple; [sector, caracter] estratifica los pliegues (solo con agrupar_por: ies)

