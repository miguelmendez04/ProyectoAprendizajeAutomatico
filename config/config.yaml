# Configuración del ETL de deserción en educación superior (Colombia).
# Todos los IDs de datasets fueron verificados contra datos.gov.co el 2026-11-05 (ver reports/fase0.md).

# Unidad de análisis de la tabla final: ies | programa | municipio. Con `ies` el contexto territorial
# se une por el municipio sede de la IES (DIVIPOLA).
unidad_analisis: ies

# Ventana temporal común a todas las fuentes (objetivo y matrícula SNIES: 2015-2021).
anios: [2015, 2016, 2017, 2018, 2019, 2020, 2021]

# Códigos DIVIPOLA que cambiaron (viejo: nuevo), ej. "94663": "94663". Se completa con el histórico de DANE (Fase 0 d).
cambios_codigo: {}

rutas:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  reports: reports

datasets:
  # Saber 11: dataset unificado, todos los periodos en una sola tabla (columna `periodo`, ej. 20152).
  saber11: kgxf-xxbe
  snies_matricula_mpio: y9ga-zwzy      # matrícula ES por municipio y nivel, desde 2005
  snies_matricula_programa: 5wck-szir  # matrícula por IES x programa x municipio (2015-2021)
  snies_ies: n5yy-8nav                 # catálogo oficial de IES (nombre, sector, principal/seccional)
  divipola_municipios: gdxc-w37w       # catálogo oficial de municipios

# Archivos descargados a mano (DANE: cod_mpio, municipio, departamento, poblacion, nbi;
# TerriData en formato largo: cod_municipio, anio, indicador, valor). Si no existen, se omiten.
manual:
  dane: data/raw/dane/dane_poblacion_nbi.csv
  terridata: data/raw/terridata/terridata.csv

# Export de SPADIES (Analíticas > Deserción Anual > tipo de cálculo IES > IES: Diferenciado): `;`, BOM UTF-8,
# columnas IES;TIPO;1998-1..2024-2 y dos filas por IES (DESERTORES, MATRICULADOS). El código SNIES va en `IES`.
# tasa_desercion_t = desertores_t / matriculados_(t-2 semestres); la anual = suma de desertores / suma de
# matriculados t-2 de los dos semestres (promedio ponderado por el denominador).
spadies:
  archivo: data/raw/spadies/spadies_diferenciado.csv
  nacional: data/raw/spadies/spadies_nacional.csv   # solo contexto y control de sumas
  periodicidad: anual                                 # anual | semestre

# Años de rezago de las variables de matrícula SNIES (2 = mismo desfase que el denominador de la tasa).
# Saber 11 y TerriData se rezagan 1 año.
rezago_matricula: 2

# Máximo de nulos tolerado por columna en la validación (proporción 0-1).
max_nulos_pct: 0.5
