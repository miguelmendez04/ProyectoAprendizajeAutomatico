[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desercion-ies"
version = "1.0.0"
description = "Estimación de la tasa de deserción en educación superior en Colombia (IES x año): ETL, evaluación de modelos y análisis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Miguel Ángel Méndez Rodríguez" }, { name = "Simón Colonia" }]
keywords = ["deserción", "educación superior", "Colombia", "SPADIES", "aprendizaje automático"]
# Versiones exactas con las que se generaron los resultados (Python 3.14.6, Windows 11). requirements.txt se genera desde aquí (make requirements).
dependencies = [
    "pandas==3.0.3",
    "numpy==2.4.6",
    "scipy==1.18.0",
    "scikit-learn==1.9.0",
    "xgboost==3.4.1",
    "shap==0.54.1",
    "joblib==1.5.3",
    "threadpoolctl==3.5.0",
    "psutil==7.2.2",
    "matplotlib==3.11.0",
    "pandera==0.35.0",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.1",
    "pre-commit==4.7.0",
    "nbformat==5.10.4",
    "nbconvert==7.17.1",
    "nbclient==0.11.0",
    "ipykernel==6.31.0",
    "jupyter_core==5.9.1",
    "jupyter_client==8.9.1",
]

[project.scripts]
desercion = "desercion_ies.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "integration: necesita data/processed, data/interim o los resultados publicados en reports/ (se omite si faltan)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks/*.ipynb"]  # cuadernos generados por notebooks/construir/
force-exclude = true  # también cuando pre-commit pasa los archivos uno a uno

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501 desactivado: tras `ruff format` quedan ~1.400 líneas largas que son prosa en español (docstrings, comentarios y plantillas de los informes);
# partirlas cambiaría el texto de los informes publicados.
ignore = ["E501"]
